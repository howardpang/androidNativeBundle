apply plugin: 'maven-publish'
apply plugin: 'signing'

def isReleaseBuild() {
    return version.contains("SNAPSHOT") == false
}

def getReleaseRepositoryUrl() {
    return hasProperty('RELEASE_REPOSITORY_URL') ? RELEASE_REPOSITORY_URL
            : "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
}

def getSnapshotRepositoryUrl() {
    return hasProperty('SNAPSHOT_REPOSITORY_URL') ? SNAPSHOT_REPOSITORY_URL
            : "https://s01.oss.sonatype.org/content/repositories/snapshots/"
}

Properties properties = new Properties()
properties.load(project.rootProject.file('local.properties').newDataInputStream())
publishing {
    repositories {
        maven {
            credentials {
                username = properties.getProperty('ossrhUsername')
                password = properties.getProperty('ossrhPassword')
            }

            if (isReleaseBuild()) {
                url getReleaseRepositoryUrl()
            } else {
                url getSnapshotRepositoryUrl()
            }
        }
    }
}

tasks.named('publish') {
    finalizedBy tasks.named('postRelease')
}

tasks.register('postRelease') {
    doLast {
        def username = properties.getProperty('ossrhUsername')
        def password = properties.getProperty('ossrhPassword')
        def url = "https://ossrh-staging-api.central.sonatype.com/" + "manual/upload/defaultRepository/io.github.howardpang"
        // 发送 POST 请求，使发布文件能在 central sonatype 中显示
        def connection = new URL(url).openConnection() as HttpURLConnection
        connection.setRequestMethod("POST")
        connection.setRequestProperty("Content-Type", "application/x-www-form-urlencoded")
        connection.setRequestProperty('Authorization', 'Basic ' + "${username}:${password}".bytes.encodeBase64().toString())
        connection.doOutput = false

        // 读取响应
        def response = connection.inputStream.text
        println "POST 响应: ${response}"
    }
}